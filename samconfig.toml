# Configuration file for AWS SAM CLI
# Documentation: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
version = 0.1

[default]
[default.global.parameters]
stack_name = "mercado-publico-rag-aws"
region = "us-east-1"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
parameter_overrides = "Environment=\"dev\" BedrockModelId=\"us.anthropic.claude-haiku-4-5-20251001-v1:0\""
image_repositories = []
s3_prefix = "mercado-publico-rag-aws"

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
port = 3000
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
port = 3001
warm_containers = "EAGER"

